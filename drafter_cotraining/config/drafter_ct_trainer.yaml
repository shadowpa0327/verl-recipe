# Drafter Co-Training trainer config.
#
# Thin override on top of trainer/config/ppo_trainer.yaml. Adds:
#   - hs_collector:*    (HSCollectorConfig + inline vLLM engine_kwargs for the
#                        MooncakeHiddenStatesConnector + extract_hidden_states)
#   - drafter:*         (picked up by ActorRolloutRefDrafterWorker; disabled
#                        by default so this config is also usable for rollout+HS
#                        micro tests without wiring a drafter model)
#
# Override with:
#   --config-path verl/trainer/drafter/config --config-name drafter_ct_trainer

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# Mooncake connection info — single source of truth, referenced by both the
# HS collector's producer-side kv_connector_extra_config (below) and by the
# drafter worker's reader via meta_info (injected by the trainer).
mooncake:
  master_server_address: localhost:50051
  metadata_server: http://localhost:8090/metadata
  local_hostname: localhost
  protocol: tcp
  kv_lease_ttl_s: 30.0

# Hidden-states collector (colocated vLLM replica, time-multiplexed with actor rollout).
hs_collector:

  # Target dataclass for omega_conf_to_dataclass hydration.
  _target_: recipe.drafter_cotraining.hs_collector.HSCollectorConfig

  # Master switch. When False the trainer skips HS collection entirely.
  enabled: True

  # HF model path for the HS collector vLLM. Usually identical to actor model path.
  model_path: ${actor_rollout_ref.model.path}

  # Standalone-only; unused when a colocated resource_pool is passed in.
  n_gpus_per_node: ${trainer.n_gpus_per_node}

  # Standalone-only; unused when a colocated resource_pool is passed in.
  nnodes: ${trainer.nnodes}

  # vLLM rollout config for the HS collector replica.
  inference:

    # Rollout backend. vllm is the only supported choice here.
    name: vllm

    # sync: LLM, async: AsyncLLM. Must be async for the HS collector's AsyncLLMServerManager.
    mode: async

    # Tensor parallel size inside one HS-collector replica.
    tensor_model_parallel_size: 1

    # Data parallel size inside one HS-collector replica.
    data_parallel_size: 1

    # Pipeline parallel size inside one HS-collector replica.
    pipeline_model_parallel_size: 1

    # Max model length for prefill-only requests.
    max_model_len: ${data.max_prompt_length}

    # Fraction of VRAM for the HS collector vLLM. Keep low because it's colocated with the actor rollout.
    gpu_memory_utilization: 0.3

    # Tensor dtype. Must match actor dtype.
    dtype: bfloat16

    # Whether to force vLLM to run in eager mode.
    enforce_eager: True

    # Chunked prefill off — speculative extract_hidden_states wants full prefill.
    enable_chunked_prefill: False

    # Prefix caching off to avoid skipping the KV connector save path.
    enable_prefix_caching: False

    # Engine kwargs passed through verbatim to vLLM. This is where we wire
    # the Mooncake KV connector + extract_hidden_states speculative config.
    engine_kwargs:
      vllm:

        # Trust remote code for HF AutoConfig.
        trust_remote_code: True

        # MP executor (single node, colocated).
        distributed_executor_backend: mp

        # Disable custom all reduce to match verl's teacher path.
        disable_custom_all_reduce: True

        # vLLM KV transfer: write hidden states to Mooncake instead of the usual KV cache transfer.
        kv_transfer_config:

          # Name of the connector class defined in recipe.drafter_cotraining.mooncake.hidden_states_connector.
          kv_connector: MooncakeHiddenStatesConnector

          # Dotted path to the connector module — vLLM discovers it without factory registration.
          kv_connector_module_path: recipe.drafter_cotraining.mooncake.hidden_states_connector

          # Producer role — this connector writes, doesn't read.
          kv_role: kv_producer

          # Mooncake connection info flows here from the top-level mooncake: block.
          # The connector reads this directly (preferred over MOONCAKE_* env vars).
          kv_connector_extra_config: ${mooncake}

        # Speculative decoding hook used to capture the aux layer hidden states.
        speculative_config:

          # Must be "extract_hidden_states" — the vLLM hook that triggers the connector save path.
          method: extract_hidden_states

          # Minimum value; we only need the hook to fire, not actually sample speculative tokens.
          num_speculative_tokens: 1

          # Aux layer ids must be set per-model on the CLI or by an auto-deriver.
          # Example for Qwen3-0.6B (28 layers): [1, 13, 24, 27] — set via CLI override.
          draft_model_config:
            hf_config:
              eagle_aux_hidden_state_layer_ids: ???

# Drafter training config — nested under actor_rollout_ref so the
# ActorRolloutRefDrafterWorker (which receives `config=self.config.actor_rollout_ref`
# from the trainer) can read it as `config.drafter`.
# Set actor_rollout_ref.drafter.enable=True to run drafter updates.
actor_rollout_ref:

  drafter:

    # Master switch. False = no drafter worker engine is built, update_drafter is a no-op.
    enable: False

    # Optional: "eagle_forward_kl" sets the TrainingWorker's loss_fn; leave unset
    # since update_drafter computes the 0.8^i-weighted plosses directly without
    # going through the TrainingWorker.train_batch path.
    loss_fn: null

    # Drafter model config — converted to DrafterModelConfig dataclass in _init_drafter.
    model_config:
      # OPTIONAL template overlay for the draft architecture. When null
      # (default) the draft architecture is auto-derived from
      # target_model_path's HF AutoConfig: hidden_size, num_attention_heads,
      # vocab_size, rope_*, rms_norm_eps, etc. inherit from target;
      # num_hidden_layers is forced to 1 (Eagle3 invariant).
      # Provide a JSON only to (a) activate vocab pruning (set
      # draft_vocab_size < vocab_size), (b) target a non-Llama architecture
      # (e.g. DeepSeek), or (c) override attention_bias / sliding_window
      # for non-Llama targets. See generate_draft_model_config() in
      # eagle3/draft/auto.py.
      local_path: null
      dtype: bfloat16
      ttt_length: 7
      # Draft attention backend: flex_attention or fa4.
      attention_backend: flex_attention
      # Target (verifier) model path — REQUIRED. Used both to (a) auto-derive
      # the draft architecture (above) and (b) load the frozen embed_tokens +
      # lm_head + model.norm weights into the drafter at init (rank 0 reads
      # the safetensors / HF snapshot, dist.broadcast handles the rest).
      # Defaults to actor_rollout_ref.model.path so drafter and actor agree.
      target_model_path: ${actor_rollout_ref.model.path}

    # FSDP engine config — keys here match FSDPEngineConfig fields. Defaults are
    # sensible for a tiny draft model on 2+ GPUs. Override from CLI if needed.
    engine_config:
      # FSDP2 with selective wrap (TorchSpec-style): only LlamaDecoderLayer
      # gets its own FSDP unit; lm_head/norm/fc/embed_tokens stay in the root
      # unit so they remain gathered through backward (auto-root-detect sets
      # the root's effective reshard_after_forward=False). The override lives
      # in FSDPDrafterEngine._build_fsdp_module — see drafter_engine.py.
      # Without this override, verl's default apply_fsdp2 would wrap lm_head as
      # its own sub-unit (when tie_word_embeddings=False, e.g. Qwen3-8B), which
      # would cause the compiled loss kernel to see a non-gathered DTensor.
      strategy: fsdp2
      fsdp_size: -1
      # Draft model is tiny; keep on GPU to avoid offload overhead dominating.
      param_offload: False
      optimizer_offload: False
      use_remove_padding: False

      # Per-GPU micro-batch size for update_drafter accumulation. Total samples
      # per macro-step is data.train_batch_size; accumulation_steps =
      # ceil(B_per_rank / micro_batch_size_per_gpu). micro_size=1 minimizes peak
      # resident memory for target_p_padded; raise it for fewer accumulation
      # steps when memory permits.
      micro_batch_size_per_gpu: 1

    # FSDP optimizer config — keys match FSDPOptimizerConfig. total_training_steps
    # must be set at runtime (e.g. to micro.max_steps in the training smoke) or
    # the cosine LR scheduler plateaus immediately. Defaults track TorchSpec's
    # eagle3 training knobs (lr=1e-4, weight_decay=0, warmup_ratio=0.015,
    # max_grad_norm=0.5, cosine decay) so smoke runs match its training signal.
    optimizer_config:
      lr: 1.0e-4
      weight_decay: 0.0
      lr_warmup_steps_ratio: 0.015
      lr_scheduler_type: cosine
      min_lr_ratio: 0.0
      clip_grad: 0.5
      total_training_steps: -1

    # Checkpoint config — for now we don't save drafter checkpoints in the smoke.
    checkpoint_config:
      save_contents: ['model', 'optimizer', 'extra']
      load_contents: ['model', 'optimizer', 'extra']
